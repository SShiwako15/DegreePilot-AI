name: degreepilot
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-degreepilot}
      POSTGRES_USER: ${POSTGRES_USER:-degreepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-fictional-database-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: Development
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-degreepilot}
      DB_USER: ${POSTGRES_USER:-degreepilot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-fictional-database-only}
      DEMO_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Local-Demo-Only!2026}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PLANNER_URL: http://planner:8000/
      Security__LoginRequestsPerMinute: ${Security__LoginRequestsPerMinute:-20}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
  planner:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    read_only: true
    environment:
      AI_ADVISOR_ENABLED: ${AI_ADVISOR_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres-data:
