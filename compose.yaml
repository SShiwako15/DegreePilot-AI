name: degreepilot
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-degreepilot}
      POSTGRES_USER: ${POSTGRES_USER:-degreepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-fictional-database-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-degreepilot};Username=${POSTGRES_USER:-degreepilot};Password=${POSTGRES_PASSWORD:-local-fictional-database-only}
      Demo__Enabled: "true"
      Demo__Password: ${DEMO_PASSWORD:-Local-Demo-Only!2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres-data:
